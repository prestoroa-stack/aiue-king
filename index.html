<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あいうえ王</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f6f5f1; --fg:#222; --card:#fff; --muted:#777; --line:#d9d6cc;
  --used-bg:#d3d1ca; --accent:#3b6fd4; --accent-fg:#fff; --good:#2e8b57; --bad:#c0392b; --warn:#b36b00; --warn-bg:#fff3d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181d; --fg:#e8e8e8; --card:#222630; --muted:#9aa0ad; --line:#3a3f4b;
    --used-bg:#383c47; --accent:#6b98f0; --accent-fg:#101420; --good:#58c58b; --bad:#ef6b5c; --warn:#f0a93a; --warn-bg:#3b3220;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:1.4rem;margin:8px 0 12px}
h2{font-size:1rem;margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.muted{color:var(--muted);font-size:.85rem;margin:4px 0}
.msg{min-height:1.4em;color:var(--bad);font-size:.9rem;margin:6px 0 0}
label{display:block;font-size:.9rem;margin-bottom:8px}
input,select{font-size:16px;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-top:4px}
.row{display:flex;gap:8px;align-items:stretch}
.row input{margin-top:0;flex:1}
button{font-size:15px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.topbar b{font-size:1.2rem;letter-spacing:.12em}
.banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.92rem}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.banner.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.turn{font-weight:700;font-size:1.05rem;margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.turn.mine{border-color:var(--accent);color:var(--accent)}
.player{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.player.me{border-color:var(--muted)}
.player.turn-now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.player.out{filter:grayscale(1);opacity:.45}
.pname{font-weight:600;margin-bottom:6px;word-break:break-all}
.cells{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:clamp(.95rem,4.6vw,1.3rem)}
.cell.open{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.mine-word{font-size:.8rem;color:var(--muted);margin-top:6px}
.kana{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:380px}
.k{text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:6px;font-size:1.05rem}
.k.used{color:var(--muted);background:var(--used-bg);border-color:var(--used-bg);text-decoration:line-through;opacity:.7}
button.k{background:var(--card);color:var(--fg);font:inherit;font-size:1.05rem;padding:12px 0;cursor:pointer}
button.k:hover{border-color:var(--accent)}
button.k.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.rh{margin-top:10px}
.results{list-style:none;margin:0 0 12px;padding:0}
.results li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.results li.win{background:var(--warn-bg);border-radius:8px}
.results li.out{color:var(--muted)}
.rword{font-weight:700;letter-spacing:.08em;white-space:nowrap}
.cell.pop{animation:cellpop .5s ease}
@keyframes cellpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.fx-card{background:rgba(0,0,0,.75);color:#fff;padding:22px 36px;border-radius:20px;text-align:center}
.fx-hit{font-size:clamp(2.4rem,14vw,4rem);font-weight:900;color:#ffd84a;letter-spacing:.05em;line-height:1.1}
.fx-sub{font-size:1.1rem;margin-top:6px}
.fx-out{font-size:.95rem;margin-top:6px;color:#ff9d92}
#fx.run .fx-card{animation:fxpop 1.5s ease both}
@keyframes fxpop{0%{transform:scale(.4);opacity:0}14%{transform:scale(1.15);opacity:1}24%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
@media (prefers-reduced-motion: reduce){#fx.run .fx-card,.cell.pop{animation:none}}
.k.empty{border-color:transparent}
#log{margin:0;padding-left:1.3em;font-size:.88rem}
#log{list-style:none;padding-left:0}
#log li{margin-bottom:2px}
#log li:first-child{font-weight:700}
.plist div{padding:3px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
#toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <h1>あいうえ王</h1>

  <!-- ホーム -->
  <section id="home">
    <div class="box">
      <label>名前
        <input id="nameInput" maxlength="12" autocomplete="off">
      </label>
    </div>
    <div class="box">
      <h2>部屋を作る（ホスト）</h2>
      <p class="muted">あなたのブラウザがゲームの進行役になります。ゲーム中は閉じたり、スマホで他のアプリに切り替えたりしないでください。</p>
      <button id="createBtn" class="primary">部屋を作る</button>
    </div>
    <div class="box">
      <h2>部屋に参加する</h2>
      <label>ルームコード
        <input id="codeInput" maxlength="8" autocapitalize="characters" autocomplete="off">
      </label>
      <button id="joinBtn" class="primary">参加</button>
    </div>
    <p id="homeMsg" class="msg"></p>
  </section>

  <!-- ゲーム画面 -->
  <section id="game" hidden>
    <div class="topbar">
      <div>部屋 <b id="codeText"></b></div>
      <div>
        <button id="soundBtn" title="効果音のオン/オフ">🔊</button>
        <button id="copyBtn">招待リンク</button>
        <button id="leaveBtn">退出</button>
      </div>
    </div>
    <div id="connBanner" class="banner bad" hidden>
      <span id="connText"></span> <button id="reconnectBtn">再接続</button>
    </div>

    <!-- ロビー -->
    <div id="lobbyPanel">
      <div class="box"><h2>参加者</h2><div id="lobbyPlayers" class="plist"></div><p id="ruleLine" class="muted"></p></div>
      <div class="box">
        <h2>あなたのお題</h2>
        <p class="muted" id="wordRule"></p>
        <div class="row">
          <input id="wordInput" autocomplete="off" placeholder="ひらがな・カタカナ">
          <button id="wordBtn" class="primary">設定</button>
        </div>
        <p id="myWordLine" class="muted"></p>
      </div>
      <div class="box" id="hostBox">
        <h2>ホスト設定</h2>
        <label>最大文字数 <select id="maxLenSel"></select></label>
        <label>ヒットしたあとのボーナス <select id="bonusSel"></select></label>
        <button id="startBtn" class="primary">ゲーム開始</button>
        <p class="muted" id="startHint"></p>
      </div>
      <p id="waitHost" class="muted">ホストが開始するのを待っています…</p>
    </div>

    <!-- プレイ画面 -->
    <div id="playPanel" hidden>
      <div id="turnBar" class="turn"></div>
      <div id="remindBanner" class="banner warn" hidden></div>
      <div id="cards"></div>
      <div id="overBox" class="box" hidden>
        <h2 id="overTitle"></h2>
        <p id="overSub" class="muted"></p>
        <h2 class="rh">みんなのお題</h2>
        <ol id="results" class="results"></ol>
        <button id="backLobbyBtn" class="primary">ロビーに戻る</button>
        <p id="overWait" class="muted">ホストの操作を待っています…</p>
      </div>
      <div class="box"><h2>50音表</h2><div id="kana"></div><p id="kanaHint" class="muted"></p></div>
      <div class="box"><h2>ログ</h2><ul id="log"></ul></div>
    </div>
  </section>
</div>
<div id="toast"></div>
<div id="fx" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';

/* ================= 設定 ================= */
const PREFIX = 'aiue-ou-v1-';   // 他アプリのIDとぶつからないための目印
const REMIND_MS = 120000;           // 無応答2分で催促
const TIMEOUT_MS = 60000;           // 催促からさらに1分で自動終了
const DEFAULT_LEN = 7, MIN_LEN = 2, MAX_LEN = 20, MAX_PLAYERS = 10;
// ヒット後のボーナス回数: 0=なし / 1〜4=追加で選べる回数 / -1=ミスするまで無制限
const BONUS_OPTIONS = [0, 1, 2, 3, 4, -1], DEFAULT_BONUS = 1;
const bonusName = b => b === 0 ? '追加なし' : (b < 0 ? '＋無限（ミスするまで）' : '＋' + b + '回' + (b === DEFAULT_BONUS ? '（標準）' : ''));

/* ================= 50音表・正規化 ================= */
const ROWS = ['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの',
              'はひふへほ','まみむめも','や　ゆ　よ','らりるれろ','わ　を　ん','ー'];
const ALLOWED = new Set([...ROWS.join('')].filter(c => c !== '　'));
const SMALL = {'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ','ゎ':'わ'};

// カタカナ→ひらがな、濁点・半濁点を除去、小さい文字→大きい文字
function normalize(text){
  let out = '';
  for (let ch of String(text).trim().normalize('NFKD')) {
    const c = ch.codePointAt(0);
    if (c >= 0x30A1 && c <= 0x30F6) ch = String.fromCodePoint(c - 0x60);
    if (ch === '\u3099' || ch === '\u309A') continue;
    out += SMALL[ch] || ch;
  }
  return out;
}

/* ================= 共通ユーティリティ ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = n => Math.random().toString(36).slice(2, 2 + n);
function toast(m){
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function randCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

let myToken = null;
try { myToken = sessionStorage.getItem('aiue-token'); } catch (e) {}
if (!myToken) { myToken = rand(12); try { sessionStorage.setItem('aiue-token', myToken); } catch (e) {} }

/* ================= 通信まわりの状態 ================= */
let role = null;        // 'host' | 'client'
let peer = null, hostConn = null;
let roomCode = '', myName = '';
let leaving = false, autoRetried = false;
let view = null;        // 最後に受け取った（または自分で作った）公開状態
let pending = false, pendingTimer = null;   // タップ直後の二重送信防止
let G = null;           // ホストだけが持つゲームの正本

/* ================= ホスト側：ゲーム進行 ================= */
function initHostGame(name){
  G = { seq: 0, phase: 'lobby', maxLen: DEFAULT_LEN, bonus: DEFAULT_BONUS, players: [], used: new Set(),
        turn: 0, streak: 0, log: [], reminded: false, winnerId: null, elimOrder: [],
        endReason: null, endWho: null, t1: null, t2: null, evSeq: 0, ev: null };
  G.players.push({ id: 'host', token: myToken, name, word: null, revealed: [], conn: null, connected: true });
  broadcast();
}
const isElim = q => !!q.word && q.revealed.every(Boolean);
const alive = () => G.players.filter(q => !isElim(q));
const current = () => G.players[G.turn];
function glog(m){ G.log.push(m); if (G.log.length > 40) G.log.shift(); }
function clearTimers(){ clearTimeout(G.t1); clearTimeout(G.t2); }

function advance(){
  G.streak = 0;
  for (let i = 0; i < G.players.length; i++) {
    G.turn = (G.turn + 1) % G.players.length;
    if (!isElim(G.players[G.turn])) return;
  }
}

function startTurnTimer(){
  clearTimers();
  G.reminded = false;
  const who = current();
  G.t1 = setTimeout(() => {
    if (!G || G.phase !== 'play' || current() !== who) return;
    G.reminded = true;
    glog('⏰ ' + who.name + ' さん、2分経過しました。あと1分で自動終了します');
    broadcast();
    G.t2 = setTimeout(() => {
      if (!G || G.phase !== 'play' || current() !== who) return;
      finish(null, 'timeout', who);
    }, TIMEOUT_MS);
  }, REMIND_MS);
}

function finish(winner, reason, who){
  clearTimers();
  G.phase = 'over';
  G.winnerId = winner ? winner.id : null;
  G.endReason = reason;
  G.endWho = who ? who.name : null;
  if (reason === 'timeout') glog('⌛ ' + who.name + ' の応答がなかったため、ゲームを終了しました');
  else glog(winner ? '🏆 ' + winner.name + ' の勝利！' : '🤝 全員同時に脱落！引き分けです');
  broadcast();
}

// 結果表示用：勝者（または未決着の人）→ 最後に脱落した人 → … → 最初に脱落した人
function resultList(){
  const left = G.players.filter(q => !isElim(q));
  const outs = G.elimOrder.map(id => G.players.find(q => q.id === id)).filter(Boolean).reverse();
  return [...left, ...outs].map(q => ({ id: q.id, name: q.name, word: q.word, out: isElim(q), win: q.id === G.winnerId }));
}

function cellsOf(q){
  const out = [];
  for (let i = 0; i < G.maxLen; i++) out.push(q.word && i < q.word.length && q.revealed[i] ? q.word[i] : '？');
  return out;
}

// 相手に送ってよい情報だけを作る（他人のお題そのものは含めない）
function stateFor(p){
  const cur = G.phase === 'play' ? current() : null;
  const win = G.players.find(q => q.id === G.winnerId);
  return {
    code: roomCode, phase: G.phase, maxLen: G.maxLen, bonus: G.bonus, you: p.id, isHost: p.id === 'host',
    players: G.players.map(q => ({ id: q.id, name: q.name, hasWord: !!q.word, cells: cellsOf(q),
                                   eliminated: isElim(q), connected: q.connected })),
    used: [...G.used], turnId: cur ? cur.id : null, streak: G.streak, reminded: G.reminded,
    log: G.log.slice(-10), winnerName: win ? win.name : null,
    endReason: G.endReason, endWho: G.endWho, mine: p.word || null, ev: G.ev,
    answers: G.phase === 'over' ? resultList() : null   // お題が全員に見えるのはゲーム終了後だけ
  };
}

function sendTo(p, msg){
  if (p.id === 'host') { onHostMsg(msg); return; }
  try { if (p.conn && p.conn.open) p.conn.send(msg); } catch (e) {}
}
function broadcast(){ for (const p of G.players) sendTo(p, { t: 'state', s: stateFor(p) }); }

function handleAction(p, msg){
  if (!G || !msg) return;
  const err = m => sendTo(p, { t: 'err', msg: m });
  switch (msg.t) {
    case 'word': {
      if (G.phase !== 'lobby') return err('ゲーム中はお題を変更できません');
      const w = normalize(msg.word || '');
      const chars = [...w];
      if (chars.some(c => !ALLOWED.has(c))) return err('使えない文字があります（ひらがな・カタカナ・「ー」のみ）');
      if (chars.length < 2 || chars.length > G.maxLen) return err('文字数は2〜' + G.maxLen + '文字です');
      p.word = w; p.revealed = Array(w.length).fill(false);
      broadcast();
      break;
    }
    case 'cfg': {
      if (p.id !== 'host' || G.phase !== 'lobby') return;
      if (msg.maxLen !== undefined) {
        const n = Math.max(MIN_LEN, Math.min(MAX_LEN, parseInt(msg.maxLen, 10) || DEFAULT_LEN));
        G.maxLen = n;
        for (const q of G.players) {
          if (q.word && q.word.length > n) {
            q.word = null; q.revealed = [];
            sendTo(q, { t: 'err', msg: '最大文字数が変わったので、お題をもう一度設定してください' });
          }
        }
      }
      if (msg.bonus !== undefined) {
        const b = parseInt(msg.bonus, 10);
        G.bonus = BONUS_OPTIONS.includes(b) ? b : DEFAULT_BONUS;
      }
      broadcast();
      break;
    }
    case 'start': {
      if (p.id !== 'host' || G.phase !== 'lobby') return;
      if (G.players.length < 2) return err('2人以上必要です');
      if (G.players.some(q => !q.word)) return err('お題が未設定の人がいます');
      shuffle(G.players);
      G.phase = 'play'; G.turn = 0; G.streak = 0; G.used = new Set(); G.log = [];
      G.winnerId = null; G.endReason = null; G.endWho = null; G.evSeq = 0; G.ev = null; G.elimOrder = [];
      glog('ゲーム開始！');
      startTurnTimer();
      broadcast();
      break;
    }
    case 'guess': {
      if (G.phase !== 'play') return;
      if (current() !== p) return err('あなたの番ではありません');
      const c = normalize(msg.ch || '');
      if ([...c].length !== 1 || !ALLOWED.has(c)) return err('50音表の文字を1文字で入力してください');
      if (G.used.has(c)) return err('その文字はもう使われています');
      applyGuess(p, c);
      break;
    }
    case 'lobby': {
      if (p.id !== 'host' || G.phase !== 'over') return;
      clearTimers();
      G.players = G.players.filter(q => q.connected);
      for (const q of G.players) { q.word = null; q.revealed = []; }
      G.used = new Set(); G.log = []; G.phase = 'lobby'; G.winnerId = null;
      G.endReason = null; G.endWho = null; G.reminded = false; G.evSeq = 0; G.ev = null; G.elimOrder = [];
      broadcast();
      break;
    }
  }
}

function applyGuess(p, c){
  const before = new Set(G.players.filter(isElim));
  G.used.add(c);
  let hit = false;
  for (const q of G.players) {
    for (let i = 0; i < q.word.length; i++) {
      if (q.word[i] === c && !q.revealed[i]) { q.revealed[i] = true; hit = true; }
    }
  }
  glog(p.name + ' が「' + c + '」を選択 → ' + (hit ? 'ヒット！' : 'ハズレ'));
  for (const q of G.players) {
    if (isElim(q) && !before.has(q)) { glog('💀 ' + q.name + ' が脱落！（お題: ' + q.word + '）'); G.elimOrder.push(q.id); }
  }

  G.ev = { seq: ++G.evSeq, hit, ch: c, by: p.name, out: G.players.filter(q => isElim(q) && !before.has(q)).map(q => q.name) };
  const al = alive();
  if (al.length <= 1) { finish(al[0] || null, 'end'); return; }

  // 当たったらボーナス回数ぶん続けて選べる（上限に達する／ミスしたら次の人へ）
  if (hit && !isElim(p) && (G.bonus < 0 || G.streak < G.bonus)) {
    G.streak++;
    glog(p.name + ' はもう一度選べます' + (G.bonus < 0 ? '（ミスするまで続行）' : '（ボーナス ' + G.streak + '/' + G.bonus + '）'));
  } else advance();
  startTurnTimer();
  broadcast();
}

/* ================= ホスト側：接続の受け付け ================= */
function cleanName(raw, players){
  let n = String(raw || '').trim().slice(0, 12) || ('プレイヤー' + (players.length + 1));
  const base = n; let k = 2;
  while (players.some(q => q.name === n)) n = base + k++;
  return n;
}

function onIncoming(conn){
  conn.on('data', msg => onClientMsg(conn, msg));
  conn.on('close', () => onClientClose(conn));
  conn.on('error', () => {});
}

function onClientMsg(conn, msg){
  if (!G || !msg) return;
  if (msg.t === 'join') { handleJoin(conn, msg); return; }
  const p = G.players.find(q => q.conn === conn);
  if (p) handleAction(p, msg);
}

function refuse(conn, text){
  try { conn.send({ t: 'err', msg: text, fatal: true }); } catch (e) {}
  setTimeout(() => { try { conn.close(); } catch (e) {} }, 400);
}

function handleJoin(conn, msg){
  const token = String(msg.token || '').slice(0, 40);
  let p = G.players.find(q => q.id !== 'host' && q.token === token);
  if (p) {                               // 再接続
    const old = p.conn; p.conn = conn; p.connected = true;
    if (old && old !== conn) { try { old.close(); } catch (e) {} }
    glog(p.name + ' が再接続しました');
    broadcast();
    return;
  }
  if (G.phase !== 'lobby') return refuse(conn, 'このゲームはもう始まっています');
  if (G.players.length >= MAX_PLAYERS) return refuse(conn, '満員です');
  p = { id: 'p' + (++G.seq), token, name: cleanName(msg.name, G.players), word: null, revealed: [], conn, connected: true };
  G.players.push(p);
  broadcast();
}

function onClientClose(conn){
  if (!G) return;
  const p = G.players.find(q => q.conn === conn);
  if (!p) return;
  if (G.phase === 'lobby') {
    G.players = G.players.filter(q => q !== p);
  } else {
    p.connected = false; p.conn = null;
    glog(p.name + ' の接続が切れました');
  }
  broadcast();
}

/* ================= 部屋の作成・参加 ================= */
function getName(){
  let n = $('nameInput').value.trim().slice(0, 12);
  if (!n) n = 'プレイヤー' + (Math.floor(Math.random() * 90) + 10);
  try { localStorage.setItem('aiue-name', n); } catch (e) {}
  return n;
}
function homeMsg(m){ $('homeMsg').textContent = m || ''; }
function showHome(){ $('home').hidden = false; $('game').hidden = true; document.title = 'あいうえ王'; }

function closePeer(){
  try { if (hostConn) hostConn.close(); } catch (e) {}
  try { if (peer) peer.destroy(); } catch (e) {}
  hostConn = null; peer = null;
  if (G) { clearTimers(); }
}

function startHost(){
  homeMsg('');
  if (typeof Peer === 'undefined') { homeMsg('通信ライブラリを読み込めませんでした。ネット接続を確認して再読み込みしてください。'); return; }
  leaving = false; role = 'host'; myName = getName();
  attemptCreate(0);
}
function attemptCreate(n){
  const code = randCode();
  const pr = new Peer(PREFIX + code);
  let opened = false;
  pr.on('open', () => {
    opened = true; peer = pr; roomCode = code;
    initHostGame(myName);
  });
  pr.on('connection', onIncoming);
  pr.on('disconnected', () => { try { if (!pr.destroyed) pr.reconnect(); } catch (e) {} });
  pr.on('error', e => {
    if (!opened) {
      try { pr.destroy(); } catch (x) {}
      if (e.type === 'unavailable-id' && n < 5) attemptCreate(n + 1);
      else { role = null; homeMsg('部屋を作れませんでした（' + e.type + '）。時間をおいてもう一度お試しください。'); }
    } else {
      console.warn('peer error', e);
    }
  });
}

function joinRoom(codeRaw, isRetry){
  const code = String(codeRaw || '').trim().toUpperCase();
  if (!code) { homeMsg('ルームコードを入力してください'); return; }
  if (typeof Peer === 'undefined') { homeMsg('通信ライブラリを読み込めませんでした。ネット接続を確認して再読み込みしてください。'); return; }
  homeMsg('');
  leaving = false; role = 'client'; roomCode = code;
  if (!isRetry) myName = getName();
  closePeer();

  const pr = new Peer();
  peer = pr;
  let joined = false;
  const timer = setTimeout(() => { if (!joined) failJoin(isRetry, '接続できませんでした。コードを確認してください。'); }, 12000);

  pr.on('open', () => {
    const c = pr.connect(PREFIX + code, { serialization: 'json', reliable: true });
    hostConn = c;
    c.on('open', () => c.send({ t: 'join', name: myName, token: myToken }));
    c.on('data', msg => {
      if (msg && msg.t === 'state' && !joined) { joined = true; clearTimeout(timer); autoRetried = false; }
      onHostMsg(msg);
    });
    c.on('close', () => onHostClose(c));
    c.on('error', () => {});
  });
  pr.on('error', e => {
    clearTimeout(timer);
    if (joined) return;
    failJoin(isRetry, e.type === 'peer-unavailable' ? 'その部屋が見つかりません' : '接続エラー（' + e.type + '）');
  });
}
function failJoin(isRetry, text){
  closePeer();
  if (isRetry) showConn(text, true);
  else { role = null; homeMsg(text); }
}

function showConn(text, withBtn){
  $('connBanner').hidden = false;
  $('connText').textContent = text;
  $('reconnectBtn').hidden = !withBtn;
}

function onHostClose(c){
  if (c !== hostConn || leaving) return;
  showConn('ホストとの接続が切れました。', true);
  if (!autoRetried) {
    autoRetried = true;
    setTimeout(() => { if (!leaving && role === 'client' && !$('connBanner').hidden) joinRoom(roomCode, true); }, 1500);
  }
}

function leave(){
  if (role === 'host' && G) {
    for (const p of G.players) if (p.conn && p.conn.open) { try { p.conn.send({ t: 'bye' }); } catch (e) {} }
    const pr = peer; peer = null;
    setTimeout(() => { try { pr && pr.destroy(); } catch (e) {} }, 300);
    clearTimers();
  } else {
    closePeer();
  }
  leaving = true; role = null; G = null; view = null;
  showHome();
}

/* ================= 受信・描画 ================= */
function onHostMsg(msg){
  if (!msg) return;
  if (msg.t === 'state') { $('connBanner').hidden = true; render(msg.s); }
  else if (msg.t === 'err') {
    if (msg.fatal) { leaving = true; closePeer(); role = null; view = null; showHome(); homeMsg(msg.msg); }
    else { toast(msg.msg); pending = false; clearTimeout(pendingTimer); if (view && view.phase === 'play') renderKana(view, view.turnId === view.you); }
  }
  else if (msg.t === 'bye') { leaving = true; closePeer(); role = null; view = null; showHome(); homeMsg('ホストが部屋を閉じました'); }
}

function sendAction(msg){
  if (role === 'host') { const me = G && G.players.find(p => p.id === 'host'); if (me) handleAction(me, msg); }
  else if (hostConn && hostConn.open) hostConn.send(msg);
  else toast('接続されていません');
}

function render(s){
  const prev = view; view = s;
  pending = false; clearTimeout(pendingTimer);
  $('home').hidden = true; $('game').hidden = false;
  $('codeText').textContent = s.code;
  const lobby = s.phase === 'lobby';
  $('lobbyPanel').hidden = !lobby;
  $('playPanel').hidden = lobby;
  if (lobby) renderLobby(s); else renderPlay(s, prev);
}

function renderLobby(s){
  document.title = 'あいうえ王（ロビー）';
  $('lobbyPlayers').innerHTML = s.players.map(p =>
    '<div>' + (p.hasWord ? '✅' : '⏳') + ' ' + esc(p.name) +
    (p.id === 'host' ? '（ホスト）' : '') + (p.id === s.you ? '（あなた）' : '') +
    (p.connected ? '' : ' ⚠切断中') + '</div>').join('');
  $('wordRule').textContent = '2〜' + s.maxLen + '文字。濁点・小さい文字は区別しません（ギャラクシー → きやらくしー）。他の人には見えません。';
  $('wordInput').placeholder = 'ひらがな・カタカナ（2〜' + s.maxLen + '文字）';
  $('myWordLine').textContent = s.mine ? 'あなたのお題： ' + s.mine + '（変更するには入力し直してください）' : 'まだ設定していません';
  $('ruleLine').textContent = 'ルール： 最大' + s.maxLen + '文字 ／ ヒット後のボーナス ' + bonusName(s.bonus);
  $('hostBox').hidden = !s.isHost;
  $('waitHost').hidden = s.isHost;
  if (s.isHost) {
    $('maxLenSel').value = String(s.maxLen);
    $('bonusSel').value = String(s.bonus);
    const ready = s.players.length >= 2 && s.players.every(p => p.hasWord);
    $('startBtn').disabled = !ready;
    $('startHint').textContent = s.players.length < 2 ? '2人以上で開始できます' : (ready ? '' : 'お題が未設定の人がいます');
  }
}

function renderKana(s, myTurn){
  const used = new Set(s.used);
  let h = '<div class="kana">';
  for (const row of ROWS) {
    const cs = [...row]; while (cs.length < 5) cs.push('　');
    for (const c of cs) {
      if (c === '　') h += '<div class="k empty"></div>';
      else if (used.has(c)) h += '<div class="k used">' + c + '</div>';
      else if (myTurn && s.phase === 'play') h += '<button type="button" class="k" data-c="' + c + '"' + (pending ? ' disabled' : '') + '>' + c + '</button>';
      else h += '<div class="k">' + c + '</div>';
    }
  }
  $('kana').innerHTML = h + '</div>';
}

// ---- ヒット演出（効果音つき） ----
let audio = null, muted = false, fxTimer = null;
try { muted = localStorage.getItem('aiue-mute') === '1'; } catch (e) {}
function unlockAudio(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audio) audio = new AC();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) {}
}
function playChime(){
  if (muted || !audio) return;
  try {
    const t = audio.currentTime;
    [[660, 0], [880, 0.11], [1320, 0.22]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.3);
      o.connect(g); g.connect(audio.destination);
      o.start(t + d); o.stop(t + d + 0.35);
    });
  } catch (e) {}
}
function playMiss(){   // ハズレの軽い効果音（下がる2音）
  if (muted || !audio) return;
  try {
    const t = audio.currentTime;
    [[392, 0], [262, 0.12]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.16, t + d + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
      o.connect(g); g.connect(audio.destination);
      o.start(t + d); o.stop(t + d + 0.25);
    });
  } catch (e) {}
}
function playWarn(){   // 催促の警告音（入力待ちの本人にだけ鳴らす）
  if (muted || !audio) return;
  try {
    const t = audio.currentTime;
    [[988, 0], [740, 0.27], [988, 0.54]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.12, t + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
      o.connect(g); g.connect(audio.destination);
      o.start(t + d); o.stop(t + d + 0.25);
    });
  } catch (e) {}
}
function playHit(ev){
  const fx = $('fx');
  fx.innerHTML = '<div class="fx-card"><div class="fx-hit">ＨＩＴ！</div><div class="fx-sub">「' + esc(ev.ch) + '」 ' + esc(ev.by) + '</div>' +
    (ev.out && ev.out.length ? '<div class="fx-out">💀 ' + ev.out.map(n => esc(n)).join('、') + ' が脱落</div>' : '') + '</div>';
  fx.hidden = false; fx.classList.remove('run'); void fx.offsetWidth; fx.classList.add('run');
  clearTimeout(fxTimer); fxTimer = setTimeout(() => { fx.hidden = true; fx.classList.remove('run'); }, 1600);
  playChime();
  if (navigator.vibrate) navigator.vibrate(80);
}

function renderPlay(s, prev){
  const myTurn = s.phase === 'play' && s.turnId === s.you;
  const curName = (s.players.find(p => p.id === s.turnId) || {}).name || '';
  const nrows = s.maxLen <= 8 ? 1 : (s.maxLen <= 16 ? 2 : 3);
  const cols = Math.ceil(s.maxLen / nrows);

  // 手番表示
  const tb = $('turnBar');
  if (s.phase === 'play') {
    tb.className = 'turn' + (myTurn ? ' mine' : '');
    const bl = !s.streak ? '' : (s.bonus < 0 ? '（ボーナス ' + s.streak + '回目）' : '（ボーナス ' + s.streak + '/' + s.bonus + '）');
    tb.textContent = myTurn ? '▶ あなたの番です' + bl : '▶ ' + curName + ' の番です' + bl;
    document.title = (myTurn ? '★あなたの番｜' : '') + 'あいうえ王';
  } else {
    tb.className = 'turn';
    tb.textContent = 'ゲーム終了';
    document.title = 'あいうえ王（終了）';
  }

  // 催促
  $('remindBanner').hidden = !(s.phase === 'play' && s.reminded);
  if (s.phase === 'play' && s.reminded) {
    $('remindBanner').textContent = '⏰ ' + curName + ' さんの入力待ちです。あと1分以内に入力がないと、ゲームを自動終了します。';
    if (myTurn && !(prev && prev.reminded)) { playWarn(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
  }

  // プレイヤー
  const prevCells = {};
  if (prev && prev.phase === 'play') for (const q of prev.players) prevCells[q.id] = q.cells;
  $('cards').innerHTML = s.players.map(p =>
    '<div class="player' + (p.id === s.you ? ' me' : '') + (s.phase === 'play' && p.id === s.turnId ? ' turn-now' : '') + (p.eliminated ? ' out' : '') + '">' +
    '<div class="pname">' + (p.eliminated ? '💀 ' : '') + esc(p.name) + (p.id === s.you ? '（あなた）' : '') + (p.connected ? '' : ' ⚠切断中') + '</div>' +
    '<div class="cells" style="--cols:' + cols + '">' +
    p.cells.map((c, i) => { const was = prevCells[p.id]; const pop = was && was[i] === '？' && c !== '？';
      return '<div class="cell' + (c === '？' ? '' : ' open') + (pop ? ' pop' : '') + '">' + esc(c) + '</div>'; }).join('') + '</div>' +
    (p.id === s.you && s.mine ? '<div class="mine-word">あなたのお題： ' + esc(s.mine) + '</div>' : '') +
    '</div>').join('');

  // 自分の番の通知
  const turnChanged = !(prev && prev.phase === 'play' && prev.turnId === s.you && prev.streak === s.streak);
  if (myTurn && turnChanged && navigator.vibrate) navigator.vibrate(120);
  $('kanaHint').textContent = myTurn ? 'タップした文字で、そのまま決定されます' : '';

  // 終了表示
  const over = s.phase === 'over';
  $('overBox').hidden = !over;
  if (over) {
    $('overTitle').textContent = s.endReason === 'timeout' ? '⌛ 無応答のため終了' :
      (s.winnerName ? '🏆 ' + s.winnerName + ' の勝利！' : '🤝 引き分け');
    $('overSub').textContent = s.endReason === 'timeout' ? s.endWho + ' さんの応答がありませんでした。' : '';
    $('results').innerHTML = (s.answers || []).map(a =>
      '<li class="' + (a.win ? 'win' : (a.out ? 'out' : '')) + '"><span>' + (a.win ? '🏆 ' : (a.out ? '💀 ' : '')) + esc(a.name) +
      (a.id === s.you ? '（あなた）' : '') + '</span><span class="rword">' + esc(a.word || '') + '</span></li>').join('');
    $('backLobbyBtn').hidden = !s.isHost;
    $('overWait').hidden = s.isHost;
  }

  renderKana(s, myTurn);
  // ヒット演出（直前の状態から1手だけ進んだときだけ）
  if (s.ev && prev && s.ev.seq === (prev.ev ? prev.ev.seq : 0) + 1) { if (s.ev.hit) playHit(s.ev); else playMiss(); }

  // ログ
  $('log').innerHTML = s.log.slice().reverse().map(l => '<li>' + esc(l) + '</li>').join('');   // 新しいものが上
}

/* ================= 画面の操作 ================= */
function submitWord(){
  const w = normalize($('wordInput').value);
  const chars = [...w];
  const max = view ? view.maxLen : DEFAULT_LEN;
  if (chars.some(c => !ALLOWED.has(c))) return toast('使えない文字があります（ひらがな・カタカナ・「ー」のみ）');
  if (chars.length < 2 || chars.length > max) return toast('文字数は2〜' + max + '文字です');
  sendAction({ t: 'word', word: w });
  $('wordInput').value = '';
}
function onEnter(el, fn){ el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); fn(); } }); }

// ボーナス回数の選択肢
for (const b of BONUS_OPTIONS) { const o = document.createElement('option'); o.value = String(b); o.textContent = bonusName(b); $('bonusSel').appendChild(o); }
// 最大文字数の選択肢
for (let n = MIN_LEN; n <= MAX_LEN; n++) { const o = document.createElement('option'); o.value = String(n); o.textContent = n + (n === DEFAULT_LEN ? '（標準）' : ''); $('maxLenSel').appendChild(o); }

$('createBtn').addEventListener('click', startHost);
$('joinBtn').addEventListener('click', () => joinRoom($('codeInput').value, false));
onEnter($('codeInput'), () => joinRoom($('codeInput').value, false));
$('leaveBtn').addEventListener('click', leave);
$('reconnectBtn').addEventListener('click', () => { autoRetried = true; joinRoom(roomCode, true); });
$('copyBtn').addEventListener('click', () => {
  const url = location.href.split('#')[0] + '#' + roomCode;
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('招待リンクをコピーしました'), () => prompt('コピーしてください', url));
  else prompt('コピーしてください', url);
});
$('wordBtn').addEventListener('click', submitWord);
onEnter($('wordInput'), submitWord);
$('bonusSel').addEventListener('change', () => sendAction({ t: 'cfg', bonus: $('bonusSel').value }));
$('maxLenSel').addEventListener('change', () => sendAction({ t: 'cfg', maxLen: $('maxLenSel').value }));
$('startBtn').addEventListener('click', () => sendAction({ t: 'start' }));
$('kana').addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-c]') : null;
  if (!b || pending || !view || view.phase !== 'play' || view.turnId !== view.you) return;
  const c = b.dataset.c;
  if (view.used.includes(c)) return;
  pending = true;                                  // 結果が返るまで押せなくする
  renderKana(view, true);
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => { pending = false; if (view && view.phase === 'play') renderKana(view, view.turnId === view.you); }, 3000);
  sendAction({ t: 'guess', ch: c });
});
document.addEventListener('pointerdown', unlockAudio);
$('soundBtn').textContent = muted ? '🔇' : '🔊';
$('soundBtn').addEventListener('click', () => {
  muted = !muted;
  $('soundBtn').textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('aiue-mute', muted ? '1' : '0'); } catch (e) {}
  if (!muted) { unlockAudio(); playChime(); }
});
$('backLobbyBtn').addEventListener('click', () => sendAction({ t: 'lobby' }));

// 初期値：保存済みの名前、招待リンク(#コード)
try { $('nameInput').value = localStorage.getItem('aiue-name') || ''; } catch (e) {}
if (location.hash.length > 1) $('codeInput').value = decodeURIComponent(location.hash.slice(1)).toUpperCase();

if (typeof window !== 'undefined') {
  window.__aiueTest = { normalize, initHostGame, handleAction, stateFor,
                        getG: () => G, setRoom: c => { roomCode = c; role = 'host'; } };
}
})();
</script>
